# Google Gemini CLI 규칙. 근거: docs/research/01 4절, 03 4절.
rules:
  - id: GM-PERM-001
    tool: gemini
    title: 셸 시작 파일·별칭에 모든 도구를 자동 승인하는 플래그(--yolo)
    severity: 높음
    detect: {type: shell_regex, regex: '\bgemini\b[^#\n]*(--yolo\b|--approval-mode[ =]+yolo|\s-y(\s|$))'}
    why: 모든 도구 호출이 승인 없이 실행된다. Nx 공급망 공격이 이 플래그로 설치된 Gemini CLI를 실행했다.
    fix: 별칭·스크립트에서 플래그를 지운다.
    incidents: [nx-s1ngularity-2025]
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md]

  - id: GM-PERM-002
    tool: gemini
    title: 기본 승인 모드가 편집 자동 승인(auto_edit)
    severity: 낮음
    docs: {kind: [settings]}
    detect: {type: equals, pointer: /general/defaultApprovalMode, values: [auto_edit]}
    why: 파일 편집 도구가 확인 없이 실행된다.
    fix: default로 둔다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md]

  - id: GM-PERM-003
    tool: gemini
    title: 모든 셸 명령을 확인 없이 허용(run_shell_command 전체)
    severity: 높음
    docs: {kind: [settings]}
    detect: {type: list_match, pointer: /tools/allowed, equals: [run_shell_command], regex: ['run_shell_command\(\s*\*?\s*\)']}
    why: 인자 없이 허용하면 모든 셸 명령이 묻지 않고 실행된다. 허용 접두사 뒤에 명령을 붙여 우회한 사례도 있다.
    fix: run_shell_command(git status)처럼 필요한 명령만 적는다.
    incidents: [tracebit-gemini-2025]
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md]

  - id: GM-PERM-004
    tool: gemini
    title: 폴더 신뢰 기능을 끔
    severity: 높음
    docs: {kind: [settings], layer: [user, system, system-defaults]}
    detect: {type: equals, pointer: /security/folderTrust/enabled, values: [false]}
    why: 신뢰하지 않은 폴더의 프로젝트 설정·.env·MCP 서버가 그대로 적용된다.
    fix: true로 되돌린다(기본값).
    incidents: [gemini-cve-2026-12537]
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/trusted-folders.md]

  - id: GM-PERM-006
    tool: gemini
    title: 도구 영구 승인(모든 이후 세션 허용) 켬
    severity: 낮음
    docs: {kind: [settings]}
    detect: {type: equals, pointer: /security/enablePermanentToolApproval, values: [true]}
    why: 한 번 누른 승인이 정책 파일에 남아 이후 세션에서도 계속 적용된다.
    fix: 필요 없으면 끈다. ~/.gemini/policies/ 의 allow 규칙을 확인한다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/policy-engine.md]

  - id: GM-SBX-001
    tool: gemini
    title: 샌드박스 안에서 네트워크 허용
    severity: 중간
    docs: {kind: [settings]}
    detect: {type: equals, pointer: /tools/sandboxNetworkAccess, values: [true]}
    why: 샌드박스 안에서 실행된 명령이 외부로 데이터를 보낼 수 있다.
    fix: false로 둔다(기본값).
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md]

  - id: GM-MCP-001
    tool: gemini
    title: MCP 서버의 모든 도구 확인을 건너뜀(trust = true)
    severity: 높음
    docs: {kind: [settings]}
    detect: {type: equals, pointer: /mcpServers/*/trust, values: [true]}
    why: 공식 문서 표현 그대로 이 서버의 모든 도구 호출 확인을 건너뛴다. 쓰기·외부 전송 도구도 묻지 않는다.
    fix: trust를 지우고 필요한 도구만 includeTools로 고른다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/mcp-server.md]

  - id: GM-MCP-002
    tool: gemini
    title: MCP 서버 이름에 밑줄(_)이 있음
    severity: 낮음
    detect: {type: check, name: gm_mcp_underscore}
    why: 공식 문서는 서버 이름에 밑줄이 있으면 정책 엔진이 이름을 잘못 읽어 보안 정책이 조용히 실패할 수 있다고 경고한다.
    fix: 밑줄 대신 하이픈(-)을 쓴다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/reference/configuration.md]

  - id: GM-HOOK-001
    tool: gemini
    title: 저장소 설정에 훅(자동 실행 명령)이 있음
    severity: 중간
    docs: {kind: [settings], layer: [project]}
    detect: {type: present, pointer: /hooks}
    why: 훅은 사용자 권한으로 임의 명령을 실행한다(공식 문서 경고).
    fix: 훅 명령을 확인하고 모르는 명령이면 지운다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/hooks/index.md]

  - id: GM-SEC-001
    tool: gemini
    title: 저장소의 .gemini/.env에 API 키가 평문으로 있음
    severity: 중간
    detect: {type: check, name: gm_dotenv_key}
    why: 저장소 안 파일은 실수로 커밋되기 쉽고, 폴더 신뢰를 우회한 사례에서는 이 파일이 그대로 읽혔다.
    fix: 키를 사용자 폴더(~/.gemini/.env)나 비밀 관리 도구로 옮기고 .gitignore를 확인한다.
    incidents: [gemini-cve-2026-12537]
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/resources/faq.md]

  - id: GM-SEC-003
    tool: gemini
    title: MCP OAuth 토큰 파일 권한이 넓음
    severity: 중간
    os: [macos, linux]
    detect: {type: file_mode, paths: ['{home}/.gemini/mcp-oauth-tokens.json']}
    why: 권한이 넓으면 다른 계정이 MCP 서버 인증 토큰을 읽는다.
    fix: chmod 600 으로 권한을 줄인다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/mcp-server.md]

  - id: GM-MGMT-001
    tool: gemini
    title: 기업 시스템 설정에 YOLO 금지가 없음
    severity: 중간
    enterprise: true
    detect: {type: check, name: gm_managed_missing}
    why: 사용자가 --yolo로 모든 도구를 자동 승인할 수 있다.
    fix: 시스템 settings.json에 security.disableYoloMode 또는 admin.secureModeEnabled를 둔다.
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/enterprise.md]

  - id: GM-MGMT-002
    tool: gemini
    title: 시스템 설정 경로를 바꾸는 환경 변수가 설정됨
    severity: 중간
    detect: {type: check, name: gm_env_override}
    why: 사용자가 이 변수로 관리자 시스템 설정 대신 다른 파일을 읽게 해 정책을 우회할 수 있다.
    fix: 변수를 지운다. 기업은 래퍼 스크립트로 경로를 고정한다(공식 문서 권고).
    refs: [https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/enterprise.md]
